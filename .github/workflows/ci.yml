name: CI

# One script, but the one that provisions a developer machine and the production server,
# where a typo is discovered on a fresh box. shfmt, shellcheck and bash -n run in
# format.yml; this is what only this repo checks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The first thing anyone runs on a bare machine, where `set -eu` plus an unset
      # variable in the usage path would be a silent exit 1.
      - name: help runs on a bare machine
        run: bash bootstrap.sh --help
